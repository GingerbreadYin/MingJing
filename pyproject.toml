[project]
name = "deerflow-rag-optimizer"
version = "0.1.0"
description = "Evidence-driven, approval-gated retrieval optimization for an existing policy RAG"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pyyaml>=6", "jieba>=0.42", "rank-bm25>=0.2.2", "mcp==1.30.0"]

[project.optional-dependencies]
redis = ["redis==7.4.0"]
eval = ["ragas==0.4.3"]

[project.entry-points."deerflow.extensions"]
rag-optimizer = "optimizer.extension:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
