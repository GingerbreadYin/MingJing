<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG 检索实验室</title>
<style>
:root{color-scheme:light;--ink:#182d2b;--green:#176254;--muted:#667672;--line:#dbe3de;--paper:#f4f6f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:9px 15px;border-radius:8px}button:hover{border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--green);color:white;border-color:var(--green)}.shell{display:grid;grid-template-columns:265px 1fr;min-height:100vh}aside{background:#173a34;color:#eaf1e9;padding:28px 18px}.brand{font-size:20px;letter-spacing:.5px;font-weight:650}.sub{font-size:12px;opacity:.65;margin-bottom:30px}.task{display:block;width:100%;text-align:left;margin:9px 0;background:transparent;color:inherit;border-color:#ffffff26}.task.active{background:#ffffff15;border-color:#bed3be}.task small{display:block;opacity:.65}main{padding:30px 38px;max-width:1320px;width:100%}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}h1{font-size:28px;line-height:1.3;margin:4px 0}h2{font-size:17px;margin:0 0 15px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700}.badge{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:30px;font-size:12px}.card{border:1px solid var(--line);background:white;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #16382c04}textarea{width:100%;resize:vertical;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);background:#fafbf8}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}select{padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.flow{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}.step{font-size:12px;background:#e9eee8;border-radius:6px;padding:8px 11px}.step.now{background:var(--green);color:white}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid var(--line);padding:16px;border-radius:10px;background:#fbfcf9}.metric strong{display:block;font-size:27px;font-weight:600}.metric span{font-size:12px;color:var(--muted)}.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.notice{padding:12px 15px;background:#edf4ec;border-radius:8px;color:#345745}.error{background:#fff0ea;color:#9a3c22;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;background:#f3f6f1;padding:14px;border-radius:8px;max-height:380px;overflow:auto}.event{border-left:2px solid #c8d9ca;padding:3px 12px;margin:9px 0}.event time{font-size:11px;color:var(--muted)}details{margin:10px 0}summary{cursor:pointer}.actions{margin-top:15px}#toast{position:fixed;bottom:22px;right:22px;max-width:550px;padding:15px 22px;background:#173a34;color:white;border-radius:10px;display:none}.empty{text-align:center;padding:40px;color:var(--muted)}a{color:var(--green)}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{padding:15px}.sub{margin-bottom:10px}.task{display:inline-block;width:auto;max-width:220px}main{padding:22px}.columns{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><aside><div class="brand">◈ 检索实验室</div><div class="sub">DEERFLOW · RAG OPTIMIZER</div><button id="new" class="task">＋ 新建诊断任务</button><button id="fixtures" class="task">显示验收记录</button><div id="tasks"></div><p class="sub" style="margin-top:35px">先看证据，再决定修改。<br>每次实验保留独立记录。</p></aside>
<main><header><div><div class="eyebrow">EVIDENCE → DIAGNOSIS → VALIDATION</div><h1>让每一次检索改进有据可查</h1><div class="muted">电商政策 RAG · 诊断、审批与对照实验</div></div><span class="badge" id="budget">正在读取预算</span></header>
<section class="card" id="creator"><h2>这次希望解决什么问题？</h2><textarea id="goal">检查现有电商政策 RAG 的漏召回和无关结果，根据实际失败案例提出一个有限的检索改进方案，并保持公平的评测预算。</textarea><div class="row between" style="margin-top:12px"><select id="mode"><option value="deerflow">DeerFlow 主子 Agent 诊断</option><option value="offline">离线统计检查（不调用模型）</option></select><label><input type="checkbox" id="overlap-experiment"> 定长重叠实验（64 字无重叠对照）</label><label><input type="checkbox" id="rrf-experiment"> RRF 权重实验（等权对照）</label><button id="create" class="primary">开始诊断</button></div><p class="muted" id="availability">正在检查模型配置…</p></section>
<section class="card" id="series-memory" hidden>
  <h2>实验记忆</h2>
  <div id="memory-content"></div>
  <form id="memory-form">
    <label for="memory-note">本轮备注</label>
    <textarea id="memory-note" maxlength="600" required></textarea>
    <div class="row">
      <label><input type="checkbox" id="memory-share"> 允许后续诊断将此备注发送给模型服务</label>
      <button type="submit">保存备注</button>
    </div>
  </form>
</section>
<section id="detail"><div class="empty">从左侧选择任务，或开始一次新的诊断。</div></section></main></div><div id="toast" role="status"></div>
<script>
const base='/api/rag-optimizer';let selected=null,current=null,refreshing=false,showFixtures=false;
let stream=null,streamOpen=false,refreshPending=false,refreshTimer=null;
const labels={created:'已创建',diagnosing:'诊断中',proposal_ready:'方案汇总中',awaiting_approval:'等待方案审批',approved:'已批准',executing:'隔离整改中',verifying:'验证中',awaiting_resume:'等待续跑',awaiting_round_decision:'等待本轮决定',superseded:'已进入下一轮',awaiting_retention:'等待保留决定',retaining:'保存中',retained:'已保留',rejected:'未保留',failed:'失败',cancelled:'已取消',interrupted:'已中断'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localTime=x=>new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const pct=x=>x===null||x===undefined?'—':(x*100).toFixed(1)+'%';
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',6000)}
async function api(path,body){const r=await fetch(base+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function closeStream(){if(stream)stream.close();stream=null;streamOpen=false;}
function scheduleRefresh(){if(refreshTimer===null)refreshTimer=setTimeout(()=>{refreshTimer=null;refresh()},120);}
async function choose(id){
  closeStream();selected=id;document.getElementById('creator').hidden=true;
  document.getElementById('series-memory').hidden=true;
  document.getElementById('memory-form').reset();
  if(typeof EventSource!=='undefined'){
    const source=new EventSource(`${base}/tasks/${encodeURIComponent(id)}/stream`);
    stream=source;
    source.onopen=()=>{if(stream===source){streamOpen=true;scheduleRefresh()}};
    source.onerror=()=>{if(stream===source){streamOpen=false;scheduleRefresh()}};
    source.addEventListener('update',()=>{if(stream===source)scheduleRefresh()});
  }
  await refresh();
}
function metrics(title,m){return `<h2>${esc(title)}</h2><div class="metrics">${[['recall','关键证据召回'],['precision','结果相关比例'],['mrr','首个相关结果 MRR'],['complete','完整证据覆盖题占比']].map(([k,n])=>`<div class="metric"><strong>${pct(m?.[k])}</strong><span>${n}</span></div>`).join('')}</div>`}
async function action(name,body){try{const id=selected;const result=await api(`/tasks/${id}/${name}`,body??{});toast('操作已记录');if(name==='replan'&&selected===id){await choose(result.id)}else await refresh()}catch(e){toast(e.message)}}
function renderExperiment(plan){
  if(!plan)return '';
  const changes=Object.entries(plan.changes).map(([name,change])=>`<li><code>${esc(name)}</code> ${esc(JSON.stringify(change.before))} → ${esc(JSON.stringify(change.after))}</li>`).join('');
  return `<div class="notice"><p><strong>待验证假设</strong> ${esc(plan.hypothesis)}</p><p><strong>配置差异</strong></p><ul>${changes}</ul><p><strong>开发集目标题</strong> ${esc(plan.target_case_ids.join('、'))}</p><p><strong>目标题平均证据召回</strong> 基线 ${pct(plan.target_baseline_recall)}，至少提高 ${(plan.min_recall_gain*100).toFixed(2)} 个百分点</p><p><strong>检索预算</strong> Top-K ${esc(plan.budget.top_k)}，上下文 ${esc(plan.budget.context_chars)} 字符。常规回归门槛同时生效。</p></div>`;
}
async function renderMemory(id){
  const result=await api(`/tasks/${id}/memory`);
  if(selected!==id)return;
  const {entries,omitted}=result.context;
  const rows=entries.map(entry=>{
    const text=entry.kind==='operator_note'
      ? entry.text+(entry.truncated?'…':'')
      : `第 ${entry.round} 轮开发集召回 ${pct(entry.recall)} · ${entry.case_ids.join('、')}`;
    const source=`${base}/tasks/${encodeURIComponent(entry.source.task_id)}/events`;
    return `<li>${esc(text)} <a href="${source}" target="_blank" rel="noopener">来源事件 ${esc(entry.source.seq)}</a></li>`;
  });
  document.getElementById('memory-content').innerHTML=rows.length
    ? `<ul>${rows.join('')}</ul>${omitted?`<p class="muted">另有 ${esc(omitted)} 条记录，可在任务轨迹查看。</p>`:''}`
    : '<p class="muted">此轮和前序轮次暂无可用记忆。</p>';
  document.getElementById('series-memory').hidden=false;
}
document.getElementById('memory-form').onsubmit=async event=>{
  event.preventDefault();
  const id=selected, form=event.currentTarget, button=form.querySelector('button');
  button.disabled=true;
  try{
    await api(`/tasks/${id}/memory`,{text:document.getElementById('memory-note').value,
      include_in_model:document.getElementById('memory-share').checked});
    if(selected===id){form.reset();await renderMemory(id)}
    toast('备注已保存');
  }catch(e){toast(e.message)}finally{button.disabled=false}
};
function render(task,events){current=task;const b=task.baseline,c=task.candidate;const active=['created','diagnosing','proposal_ready','approved','executing','verifying'].includes(task.status);let html=`<div class="row between"><div><h2>${esc(task.goal)}</h2><span class="muted">${esc(localTime(task.created_at))} · ${esc(task.mode==='offline'?'离线统计任务':'DeerFlow 主子 Agent 任务')}</span></div><span class="badge">${esc(labels[task.status]||task.status)}</span></div>`;
if(task.series_id)renderMemory(task.id).catch(e=>toast(e.message));
html+=`<div class="flow">${[['诊断',['created','diagnosing','proposal_ready']],['审批',['awaiting_approval','approved']],['隔离修改',['executing']],['对照验证',['verifying']],['保留决定',['awaiting_retention','retaining','retained','rejected']]].map(([n,states])=>`<div class="step ${states.includes(task.status)?'now':''}">${n}</div>`).join('')}</div>`;
if(task.error)html+=`<div class="notice error">${esc(task.error)}</div>`;
if(b)html+=`<section class="card">${metrics('基线 · 开发集',b.metrics)}<p class="muted">${esc(b.evaluation||'')} · ${Number(b.elapsed_seconds||0).toFixed(1)} 秒</p></section>`;
if(task.series_id){
  html+=`<section class="card"><h2>实验第 ${esc(task.round_number)} 轮 · 最多 ${esc(task.max_rounds)} 轮</h2>${task.previous_task_id?'<button id="previous-round">查看上一轮</button>':''}${task.next_task_id?'<button id="next-round">查看下一轮</button>':''}`;
  if(task.previous_round)html+=`<p>上一轮依据：${task.previous_round.case_deltas.map(row=>`${esc(row.id)} ${pct(row.baseline_recall)} → ${pct(row.candidate_recall)}`).join('；')}</p>`;
  if(task.round_summary){const summary=task.round_summary,a=summary.target_assessment;html+=`${metrics('本轮候选 · 开发集',summary.metrics)}<p>目标题召回 ${pct(a.baseline_recall)} → ${pct(a.candidate_recall)}，目标门槛${a.passed?'已达标':'未达标'}。</p><p>${summary.eligible?'通过开发集门槛，可冻结候选进行最终验收。':'开发集门槛未通过，本轮未使用留出集。'}</p>`;}
  if(task.status==='awaiting_round_decision')html+=`<div class="row">${task.round_number<task.max_rounds?'<button id="replan">根据本轮结果生成下一轮方案</button>':''}${task.round_summary.eligible?'<button class="primary" id="finalize">冻结方案并开始最终验收</button>':''}</div>`;
  html+='</section>';
}
if(task.plan){html+=`<section class="card"><h2>${task.experiment_plan?'本次实验计划':'本次修改方案'}</h2><p style="white-space:pre-wrap">${esc(task.reason)}</p>${renderExperiment(task.experiment_plan)}<pre>${esc(JSON.stringify(task.plan,null,2))}</pre><div class="notice">批准后才在独立副本中生成配置、调整检索代码并运行验证。原 RAG 保持不变。</div>`;if(task.status==='awaiting_approval')html+=`<div class="row actions"><button class="primary" id="approve">批准方案并验证</button><button id="reject">拒绝方案</button></div>`;html+='</section>'}
if(c?.experiment_assessment){const a=c.experiment_assessment;html+=`<section class="card"><h2>计划目标验收</h2><p>目标题平均证据召回 ${pct(a.baseline_recall)} → ${pct(a.candidate_recall)}，实际变化 ${(a.recall_gain*100).toFixed(2)} 个百分点，要求至少提高 ${(a.min_recall_gain*100).toFixed(2)} 个百分点。</p><span class="badge">${a.passed?'已达标':'未达标'}</span></section>`;}
if(c){html+=`<section class="card">${metrics('候选 · 开发集',c.development.metrics)}<h2 style="margin-top:22px">留出集 · 冻结方案后验证</h2><div class="row"><span>关键证据召回：${pct(c.heldout.baseline_metrics.recall)} → ${pct(c.heldout.metrics.recall)}</span><span>相关比例：${pct(c.heldout.baseline_metrics.precision)} → ${pct(c.heldout.metrics.precision)}</span></div><p class="muted">${esc(c.answer_quality)}</p>`;if(task.status==='awaiting_retention')html+=`<div class="row"><button class="primary" id="retain" ${Object.values(c.retention_checks||{}).every(Boolean)?'':'disabled title="存在退化，未通过当前保留门槛"'}>保留此候选版本</button><button id="discard">不保留</button></div>`;html+='</section>'}
if(c?.original_regression){const r=c.original_regression;const checks=c.retention_checks||{};const names={heldout_recall_no_regression:'留出召回',development_recall_no_regression:'开发集召回',precision_no_regression:'开发集相关性',original_retrieval_no_regression:'原有题逐题回归',approved_target_recall_gain:'计划目标题召回'};html+=`<section class="card"><h2>原有题回归与保留检查</h2><p>关键证据召回：${pct(r.baseline.recall)} → ${pct(r.candidate.recall)}</p><div class="row">${Object.entries(checks).map(([k,v])=>`<span class="badge">${esc(names[k]||k)} · ${v?'通过':'未通过'}</span>`).join('')}</div>${(r.case_regressions||[]).map(row=>`<details><summary>${esc(row.id)} · ${esc(row.question)}</summary><pre>${esc(JSON.stringify(row,null,2))}</pre></details>`).join('')}<p class="muted">${esc(r.scope)}</p></section>`;}
if(c?.original_regression){
  html+=`<section class="card"><h2>历史实验报告</h2>
<p class="muted">以下报告来自以往的独立实验。</p>
<div class="row">
<a href="${base}/query-split" target="_blank" rel="noopener">查看 Query 拆分对照报告</a>
<a href="${base}/answer-evaluation" target="_blank" rel="noopener">查看回答质量评测</a>
<a href="${base}/onnx-benchmark" target="_blank" rel="noopener">查看 ONNX CPU 对照</a>
</div></section>`;
}
html+=`<section class="card"><h2>实际执行轨迹</h2><div>${events.slice(-30).map(e=>`<div class="event"><time>${esc(localTime(e.at))}</time><div>${esc(e.kind)}</div><details><summary>查看记录</summary><pre>${esc(JSON.stringify(e.payload,null,2))}</pre></details></div>`).join('')||'等待执行记录'}</div></section>`;
if(b?.cases)html+=`<section class="card"><h2>开发集失败案例</h2>${b.cases.filter(r=>r.scores.recall!==null&&r.scores.recall<1).map(r=>`<details><summary>${esc(r.question)} · 召回 ${pct(r.scores.recall)}</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>`).join('')||'<p class="muted">当前题集未发现漏召回，不代表没有其他检索问题。</p>'}</section>`;
if(task.execution_protocol===1){const stages={build:'候选构建',development:'开发集评测',verification:'最终验证'};html+=`<section class="card"><h2>执行检查点</h2><div class="row">${Object.entries(stages).map(([key,label])=>`<span class="badge">${label} · ${task.checkpoints?.[key]?'已登记':'待登记'}</span>`).join('')}</div>${task.status==='awaiting_resume'?'<button class="primary" id="resume">从检查点继续</button>':''}</section>`;}
html+=`<p><a href="${base}/tasks/${encodeURIComponent(task.id)}/replay" target="_blank" rel="noopener">打开离线回放</a></p>`;
if(active||['awaiting_approval','awaiting_resume','awaiting_round_decision','awaiting_retention'].includes(task.status))html+='<button id="cancel">取消任务</button>';
document.getElementById('detail').innerHTML=html;
for(const name of ['approve','resume','replan','finalize','reject','cancel']){const el=document.getElementById(name);if(el)el.onclick=()=>action(name,{plan_hash:task.plan_hash})}
for(const [button,keep] of [['retain',true],['discard',false]]){const el=document.getElementById(button);if(el)el.onclick=()=>action('retain',{keep})}
for(const [button,id] of [['previous-round',task.previous_task_id],['next-round',task.next_task_id]]){const el=document.getElementById(button);if(el)el.onclick=()=>choose(id)}
}
async function refresh(){if(refreshing){refreshPending=true;return}refreshing=true;try{const [tasks,status]=await Promise.all([api('/tasks'),api('/status')]);document.getElementById('tasks').innerHTML=tasks.filter(t=>showFixtures||!t.test_fixture).map(t=>`<button class="task ${t.id===selected?'active':''}" data-id="${esc(t.id)}">${esc(t.goal.slice(0,32))}<small>${esc(labels[t.status]||t.status)}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>choose(el.dataset.id));document.getElementById('budget').textContent=`已记录约 ¥${status.budget.committed_estimate_cny.toFixed(2)} · 总预算 ¥100`;document.getElementById('availability').textContent=status.deerflow_installed?(status.credential_configured?'DeerFlow 已安装；真实诊断会发送模拟政策、测试问题与检索结果至 DeepSeek，并消耗 API 额度。':'DeerFlow 已安装；尚未配置模型密钥，可先运行离线统计检查。'):'DeerFlow 环境未就绪，可先运行离线统计检查。';if(selected){const id=selected;const [task,events]=await Promise.all([api(`/tasks/${id}`),api(`/tasks/${id}/events`)]);if(selected===id)render(task,events)}}catch(e){toast(e.message)}finally{refreshing=false;if(refreshPending){refreshPending=false;scheduleRefresh()}}}
document.getElementById('create').onclick=async()=>{const btn=document.getElementById('create');btn.disabled=true;try{const task=await api('/tasks',{goal:document.getElementById('goal').value,mode:document.getElementById('mode').value,overlap_experiment:document.getElementById('overlap-experiment').checked,rrf_experiment:document.getElementById('rrf-experiment').checked});await choose(task.id)}catch(e){toast(e.message)}finally{btn.disabled=false}};
document.getElementById('fixtures').onclick=()=>{showFixtures=!showFixtures;document.getElementById('fixtures').textContent=showFixtures?'隐藏验收记录':'显示验收记录';refresh()};
document.getElementById('new').onclick=()=>{closeStream();selected=null;document.getElementById('creator').hidden=false;document.getElementById('series-memory').hidden=true;document.getElementById('detail').innerHTML='<div class="empty">新任务会保存独立基线与执行记录。</div>'};
refresh();setInterval(()=>{if(!streamOpen)refresh()},2500);setInterval(()=>{if(streamOpen)refresh()},15000);
</script></body></html>
